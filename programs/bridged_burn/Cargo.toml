[package]
name = "bridged_burn"
version = "0.1.0"
description = "Burn and reward bridging mechanism"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bridged_burn"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = {version = "0.31.1", features = ["metadata"]}
solana-program = "2.1.1"
mpl-token-metadata = "5.1.0"
